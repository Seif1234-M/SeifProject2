
<!DOCTYPE html>
<html>
<head>
    <title>My Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Website</h1>

    <div class="container">

        <div class="box">
            <h2>Form</h2>

            <label>Name:</label>
            <input type="text" placeholder="Enter your name">

            <label>Choose a course:</label>
            <select>
                <option>HTML</option>
                <option>CSS</option>
            </select>

            <button>Submit</button>
        </div>

        <div class="box">
            <h2>Modal</h2>

            <input type="checkbox" id="show">
            <label for="show">Open Modal</label>

            <div class="modal">
                <p>Hello, this is a modal!</p>
                <label for="show">Close</label>
            </div>
        </div>

        <div class="box">
            <h2>Messages</h2>

            <p class="success">Success message!</p>
            <p class="error">Error message!</p>
        </div>

    </div>

</body>
</html>
